{% extends "base.html" %}
{% block body %}
<div class="card auth">
  <h2>Crear cuenta</h2>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div><label>Soy</label>
      <select name="role" id="role" onchange="document.getElementById('pf').hidden = this.value !== 'pro'">
        <option value="client">Cliente (busco turno)</option>
        <option value="pro">Peluquero (ofrezco turnos)</option>
      </select></div>
    <div><label>Nombre (o nombre de la peluquería)</label><input name="name" required></div>
    <div id="pf" class="stack" hidden>
      <div><label>Dirección</label><input name="address"></div>
      <div><label>Ciudad / barrio</label><input name="city"></div>
    </div>
    <div><label>Email</label><input name="email" type="email" required></div>
    <div><label>Contraseña (mín. 6)</label><input name="password" type="password" minlength="6" required></div>
    <button>Registrarme</button>
  </form>
  <p class="mut">¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Ingresá</a></p>
</div>
{% endblock %}
