{% extends "base.html" %}
{% block body %}
<div class="card auth">
  <h2>Ingresar</h2>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div><label>Email</label><input name="email" type="email" required></div>
    <div><label>Contraseña</label><input name="password" type="password" required></div>
    <button>Entrar</button>
  </form>
  <p class="mut">¿No tenés cuenta? <a href="{{ url_for('register') }}">Registrate</a></p>
  <p class="mut">Demo: <b>cliente@demo.com</b> o <b>pelu1@demo.com</b>, clave <b>demo</b></p>
</div>
{% endblock %}
