{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Mis reservas</h2>
  {% for s in slots %}
  <div class="row item">
    <div>
      <b>{{ s.date|fecha }} {{ s.time }}</b> · {{ s.pname }}<br>
      <span class="mut">{{ s.service }} · {{ s.price|peso }} ·
        <a target="_blank" rel="noopener"
           href="https://www.google.com/maps/search/?api=1&query={{ (s.address ~ ', ' ~ s.city)|urlencode }}">📍 {{ s.address }}, {{ s.city }}</a></span>
    </div>
    <form method="post" action="{{ url_for('cancel', sid=s.id) }}" onsubmit="return confirm('¿Cancelar la reserva?')">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="del">Cancelar</button>
    </form>
  </div>
  {% else %}<p class="mut">No tenés reservas.</p>{% endfor %}
</div>
{% endblock %}
